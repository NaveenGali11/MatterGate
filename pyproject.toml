[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mattergate"
version = "0.2.0"
description = "Permissioned legal research: policy before model context"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "jinja2>=3.1.6,<4", "httpx>=0.28,<1", "itsdangerous>=2.2,<3", "python-dotenv>=1.1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*", "seed/*.json", "persistence/*.sql", "providers/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
